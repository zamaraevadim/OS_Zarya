[package]
name = "zarya-kernel"
version = "0.1.0"
edition = "2021"
authors = ["Zarya OS Team <team@zarya-os.dev>"]
description = "Ядро операционной системы Zarya - гибридное ядро на Rust"
license = "MIT"

[dependencies]
bootloader = "0.9.23"
spin = "0.9.8"
volatile = "0.4.6"
x86_64 = "0.14.10"
pic8259 = "0.10.2"
uart_16550 = "0.2.18"
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
bit_field = "0.10.2"
bitflags = "2.4.1"
linked_list_allocator = "0.10.5"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
