[package]
name = "zarya-kernel"
version = "1.0.0"
edition = "2021"
authors = ["Zarya OS Team"]
description = "Kernel for Zarya Operating System"
license = "MIT"

[lib]
crate-type = ["staticlib"]
path = "src/main.rs"

[[bin]]
name = "zarya"
path = "src/main.rs"

[dependencies]
bitflags = "2.4"
spin = "0.9"
volatile = "0.4"
x86_64 = "0.14"
bootloader = "0.9"

[dependencies.lazy_static]
version = "1.4"
features = ["spin_no_std"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"

[build-dependencies]
cc = "1.0"
